services:
  - type: web
    name: bemisaal-lead-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node --max-old-space-size=384 server.js
    envVars:
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: BRAND_NAME
        value: Bemisaal Wellness
      - key: BATCH_SIZE
        value: 15
      - key: DELAY_BETWEEN_MSGS_MS
        value: 110000
      - key: BATCH_BREAK_MS
        value: 6900000
      - key: DAILY_MAX_LEADS
        value: 150
